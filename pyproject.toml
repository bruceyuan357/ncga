[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "native-chinese-assistant"
version = "0.2.0"
description = "Rewrite arbitrary Chinese text into 10 regional varieties (Mandarin/Cantonese/Hokkien) via LLM with offline heuristic fallback."
requires-python = ">=3.10"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Bruce" }]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Operating System :: OS Independent",
    "Topic :: Text Processing :: Linguistic",
]
dependencies = [
    "certifi>=2024.2.2",
]

[project.optional-dependencies]
prod = [
    "waitress>=3.0.0",
]
dev = [
    "ruff>=0.5.0",
    "mypy>=1.10",
    "pytest>=8.0",
]

[project.scripts]
ncga = "native_chinese_assistant.web:main"

[tool.setuptools.packages.find]
include = ["native_chinese_assistant*"]
exclude = ["tests*", "static*"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "SIM", # simplify
]
ignore = [
    "E501", # line length handled by formatter
    "B008", # function calls in argument defaults are fine here
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
addopts = "-q"

[tool.mypy]
python_version = "3.10"
strict = false
warn_unused_ignores = true
warn_redundant_casts = true
disallow_incomplete_defs = true
ignore_missing_imports = true
