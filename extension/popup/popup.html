<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>地道中文 · NCGA</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header class="hdr">
    <h1>地道中文</h1>
    <span class="ver">v0.2.0</span>
  </header>

  <section id="status" class="status">
    <div id="status-line">检查中…</div>
  </section>

  <!-- Unlock panel: shown when token is locked (passphrase needed) -->
  <section id="unlock-panel" class="panel hidden">
    <label for="passphrase">解锁 passphrase</label>
    <input id="passphrase" type="password" autocomplete="off" placeholder="…" autofocus>
    <button id="unlock-btn" class="primary">解锁</button>
    <p id="unlock-err" class="err"></p>
  </section>

  <!-- Quick-rewrite panel: shown when ready -->
  <section id="rewrite-panel" class="panel hidden">
    <div class="mode-switch" role="radiogroup" aria-label="网页改写模式">
      <span class="mode-title">网页改写模式</span>
      <div class="mode-opts">
        <button type="button" class="mode-opt" data-mode="on_demand" role="radio" aria-checked="true">点选</button>
        <button type="button" class="mode-opt" data-mode="instant" role="radio" aria-checked="false">即时</button>
      </div>
      <p class="mode-hint" id="mode-hint"></p>
      <div class="row">
        <label for="default-action" class="small">即时默认动作</label>
        <select id="default-action">
          <optgroup label="改写为(方言)">
            <option value="variety:standard_putonghua">标准普通话</option>
            <option value="variety:beijing_mandarin">北京话</option>
            <option value="variety:dongbei_mandarin">东北话</option>
            <option value="variety:sichuan_chongqing_mandarin">川渝话</option>
            <option value="variety:jianghuai_or_lower_yangtze_mandarin">江淮话</option>
            <option value="variety:guangdong_mandarin">广东普通话</option>
            <option value="variety:shanghai_mandarin_style">上海话风格</option>
            <option value="variety:cantonese_written">粤语书面语</option>
            <option value="variety:hokkien_written">台湾闽南语</option>
            <option value="variety:minnan_written">福建闽南语</option>
          </optgroup>
          <optgroup label="文本工具">
            <option value="mode:polish">润色</option>
            <option value="mode:translate">中英互译</option>
            <option value="mode:summarize">总结</option>
            <option value="mode:explain">白话解释</option>
          </optgroup>
        </select>
      </div>
    </div>
    <label for="text">在弹窗里改写</label>
    <textarea id="text" rows="3" placeholder="贴一段话…"></textarea>
    <div class="row">
      <label for="variety" class="small">改写为</label>
      <select id="variety">
        <option value="standard_putonghua">标准普通话</option>
        <option value="beijing_mandarin">北京话</option>
        <option value="dongbei_mandarin">东北话</option>
        <option value="sichuan_chongqing_mandarin">川渝话</option>
        <option value="jianghuai_or_lower_yangtze_mandarin">江淮话</option>
        <option value="guangdong_mandarin">广东普通话</option>
        <option value="shanghai_mandarin_style" selected>上海话风格</option>
        <option value="cantonese_written">粤语书面语</option>
        <option value="hokkien_written">台湾闽南语</option>
        <option value="minnan_written">福建闽南语</option>
      </select>
    </div>
    <button id="rewrite-btn" class="primary">改写</button>
    <div class="tools">
      <span class="tools-title">文本工具</span>
      <div class="tools-btns">
        <button type="button" class="tool-btn" data-mode="polish">润色</button>
        <button type="button" class="tool-btn" data-mode="translate">中英互译</button>
        <button type="button" class="tool-btn" data-mode="summarize">总结</button>
        <button type="button" class="tool-btn" data-mode="explain">白话解释</button>
      </div>
    </div>
    <pre id="result" class="result"></pre>
  </section>

  <footer class="ftr">
    <a id="open-options" href="#">设置</a>
    <span class="dot">·</span>
    <a id="lock-btn" href="#" class="hidden">锁回去</a>
  </footer>

  <script src="popup.js" type="module"></script>
</body>
</html>
