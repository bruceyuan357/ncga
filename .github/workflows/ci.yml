name: CI

on:
  push:
    # claude/bold-bell-4750bf is the current default branch; keep main for a future rename.
    branches: [main, claude/bold-bell-4750bf]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # 3.14 is the version used in development.
        python-version: ["3.10", "3.11", "3.12", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: python -m unittest discover tests
      - run: python -m pytest -q tests/test_app.py
